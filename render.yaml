# Lx sur Render, version 100 % GRATUITE (essai ou démonstration).
# « New + » > « Blueprint » > choisissez le dépôt. Guide : RENDER.md
# Limites : services mis en veille après 15 min sans visite (réveil d'environ 1 à 2 min), photos et visuels
# envoyés effacés à chaque déploiement (pas de disque), base gratuite supprimée après 30 jours.
# Pour une vraie mise en ligne, utilisez render.payant.yaml.
databases:
  - name: lxsn-db
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: lx_medusa
    user: lx
    plan: free

services:
  # API Medusa + administration (/app)
  - type: web
    name: lxsn-api
    runtime: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "9000"
      # 512 Mo de mémoire au total : on limite le tas Node pour éviter l'arrêt par manque de mémoire
      - key: NODE_OPTIONS
        value: --max-old-space-size=400
      - key: DATABASE_URL
        fromDatabase:
          name: lxsn-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@lx.sn
      - key: ADMIN_PASSWORD
        sync: false # mot de passe de l'administrateur, à saisir à la création
      # Adresse publique de la vitrine. Si Render ajoute un suffixe au nom, corrigez-la (voir RENDER.md).
      - key: LX_STOREFRONT_URL
        value: https://lxsn-boutique.onrender.com
      - key: LX_DELIVERY_FEE
        value: "1500"
      - key: LX_WA_NUMBER
        value: "221770000000"
      # Paiement Wave automatique (facultatif) : à renseigner seulement si vous utilisez le mode « API Wave » (voir README)
      - key: LX_WAVE_API_KEY
        sync: false
      - key: LX_WAVE_WEBHOOK_SECRET
        sync: false

  # Vitrine, espace client et espace boutique
  - type: web
    name: lxsn-boutique
    runtime: docker
    region: frankfurt
    dockerfilePath: ./storefront/Dockerfile
    dockerContext: ./storefront
    plan: free
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "3000"
      # Un service gratuit ne reçoit pas de trafic du réseau privé : la vitrine appelle l'adresse publique de l'API.
      # Si Render ajoute un suffixe au nom, corrigez-la (voir RENDER.md).
      - key: MEDUSA_INTERNAL_URL
        value: https://lxsn-api.onrender.com
      - key: NEXT_PUBLIC_LX_PHONE
        value: "+221 77 000 00 00"
      - key: NEXT_PUBLIC_LX_EMAIL
        value: contact@lx.sn
